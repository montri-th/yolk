name: Publish Yolk web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public 1.9.7 artifact, source grains and DS assets
        run: python3 scripts/verify-pages-v1.9.8.py
      - name: Check current boundary/Demand/Opportunity-icon readability and retained mobile flow and retained opportunities, guide, recovery and analytical invariants
        run: |
          node scripts/check-three-industry.cjs
          node scripts/check-brand-presets.cjs
          node scripts/check-photo-runtime.cjs
          node scripts/check-workspace-map.cjs
          node scripts/check-criteria-controls.cjs
          node scripts/check-criteria-map.cjs
          node scripts/check-save-context.cjs
          node scripts/check-relative-supply.cjs
          node scripts/check-poi-popup.cjs
          node scripts/check-map-responsiveness.cjs
          node scripts/check-map-hover.cjs
          node scripts/check-cold-branch.cjs
          node scripts/check-branch-context.cjs
          node scripts/check-map-analysis.cjs
          node scripts/check-pattern-counts.cjs
          node scripts/check-analysis-integration.cjs
          node scripts/check-location-review.cjs
          node scripts/check-yolk-tier.cjs
          node scripts/check-map-lut41.cjs
          node scripts/check-simple-criteria.cjs
          node scripts/check-supply-compare.cjs
          node scripts/check-supply-symbols.cjs
          node scripts/check-opportunity-strategies.cjs
          node scripts/check-supply-poi-modes.cjs
          node scripts/check-unclustered-poi.cjs
          node scripts/check-workspace-transactions.cjs
          node scripts/check-bootstrap-loader.cjs
          node scripts/check-strategy-ui.cjs
          node scripts/check-demand-factors.cjs
          node scripts/check-map-clarity.cjs
          node scripts/check-action-guidance.cjs
          node scripts/check-icon-controls.cjs
          node scripts/check-map-hierarchy.cjs
          node scripts/check-map-recovery.cjs
          node scripts/check-strategy-guide.cjs
          node scripts/check-supply-market-share.cjs
          node scripts/check-supply-treemap.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
