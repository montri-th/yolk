name: Publish Yolk web preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public fixture and DS assets
        run: python3 scripts/verify-public-release.py
      - name: Check public preview routes
        run: |
          node scripts/check-public-runtime.cjs
          node scripts/check-theme-runtime.cjs
          node scripts/check-photo-runtime.cjs
          node scripts/check-map-runtime.cjs
          node scripts/check-photo-form.cjs
          node scripts/check-brand-identity.cjs
          node scripts/check-icons.cjs
          python3 scripts/verify-handoff.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
